version: "3.8"

# ============================================================================
# Wick & Wax Co. -- isolated training lab
# Start with: docker compose up -d
# ============================================================================
services:
  candleshop:
    build: .
    container_name: wickwax-candleshop
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    volumes:
      - candleshop-db:/app/instance
    networks:
      - lab-network
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge
    internal: false   # set to true to fully isolate the lab from the internet

volumes:
  candleshop-db:
