{% extends "base.html" %}
{% block content %}
<h3 class="page-title">Uploaded Files</h3>
<div class="card"><div class="card-body">
  <ul class="list-group">
    {% for f in listing %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{ f }}
      <a href="{{ url_for('download') }}?file={{ f }}" class="btn btn-sm btn-outline-primary">Download</a>
    </li>
    {% else %}<li class="list-group-item hint">No files uploaded</li>{% endfor %}
  </ul>
</div></div>
{% endblock %}
