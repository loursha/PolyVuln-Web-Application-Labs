{% extends "base.html" %}
{% block title %}Forgot Password -- Little Cubs Toy Co.{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="text-center mb-2">Reset Your Password</h2>
  <p style="font-size:.9rem; color:var(--denim-light); text-align:center;">
    Enter your username and we'll help you reset your password.
  </p>
  <form method="post" action="{{ url_for('forgot_password') }}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
  </form>
</div>
{% endblock %}
