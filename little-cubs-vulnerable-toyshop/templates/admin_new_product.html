{% extends "base.html" %}
{% block title %}New Product -- Admin{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="admin-nav">
      <a href="{{ url_for('admin_dashboard') }}">← Back to Dashboard</a>
    </div>
    <div class="form-card" style="max-width:600px;">
      <h2 class="mb-2">Add New Product</h2>
      <form method="post" action="{{ url_for('admin_new_product') }}">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category_id">
            {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" step="0.01" name="price" required>
        </div>
        <div class="form-group">
          <label>Material</label>
          <input type="text" name="material" placeholder="e.g. Organic Cotton, Plush Minky">
        </div>
        <div class="form-group">
          <label>Recommended Age</label>
          <input type="text" name="age_range" placeholder="e.g. 0+ months">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description"></textarea>
        </div>
        <div class="form-group">
          <label>Image filename (from static/images/products/)</label>
          <input type="text" name="image" placeholder="teddy-bear-classic.jpg">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Product</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
