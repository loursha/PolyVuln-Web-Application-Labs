apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fetedecadre-lab
resources:
  - namespace.yaml
  - secret.yaml
  - mysql.yaml
  - app.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: fetedecadre-db-init
    files:
      - init.sql=../db/init.sql
generatorOptions:
  disableNameSuffixHash: true
