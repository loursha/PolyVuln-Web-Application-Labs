<VirtualHost *:80>
    ServerName polyvulnbank.local
    ServerAdmin webmaster@polyvulnbank.local
    DocumentRoot /var/www/html

    PassEnv DB_HOST DB_NAME DB_USER DB_PASS APP_ENV APP_SECRET GATEWAY_SIGNING_KEY LEDGER_URL SMTP_RELAY DOC_STORE

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorDocument 404 /404.php
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
