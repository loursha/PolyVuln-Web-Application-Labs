{% extends "base.html" %}
{% block title %}Log In -- Little Cubs Toy Co.{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="text-center mb-2">Welcome Back</h2>
  <!-- Lab note: this form intentionally posts over plain HTTP with no additional
       transport protection, for CWE-319 (cleartext transmission) demonstration. -->
  <form method="post" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>
  <p class="text-center mt-2" style="font-size:.88rem;">
    <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
  </p>
  <p class="text-center" style="font-size:.88rem;">
    New here? <a href="{{ url_for('register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
