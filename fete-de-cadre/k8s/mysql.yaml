apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fetedecadre-db-data
  namespace: fetedecadre-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetedecadre-db
  namespace: fetedecadre-lab
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: fetedecadre-db } }
  template:
    metadata: { labels: { app: fetedecadre-db } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password", "--local-infile=0"]
          envFrom: [{ secretRef: { name: fetedecadre-db-root } }]
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""] }
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: fetedecadre-db-data }
        - name: init
          configMap: { name: fetedecadre-db-init }
---
apiVersion: v1
kind: Service
metadata:
  name: fetedecadre-db
  namespace: fetedecadre-lab
spec:
  selector: { app: fetedecadre-db }
  ports: [{ port: 3306, targetPort: 3306 }]
