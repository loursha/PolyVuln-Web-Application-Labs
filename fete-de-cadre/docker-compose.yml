# Fête de Cadre — intentionally vulnerable training lab.
# Binds to the machine's IPv4 so other hosts on an isolated lab network can reach it.
# Change LAB_BIND in .env to 127.0.0.1 to keep it local-only.
services:
  db:
    image: mysql:8.0
    container_name: fetedecadre-db
    environment:
      MYSQL_ROOT_PASSWORD: R00t_Frame_Lab!
    command: ["--default-authentication-plugin=mysql_native_password", "--local-infile=0"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pR00t_Frame_Lab!"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [lab]

  app:
    build: .
    container_name: fetedecadre-app
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${LAB_BIND:-0.0.0.0}:8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]
    restart: unless-stopped

networks:
  lab:
    driver: bridge

volumes:
  dbdata:
