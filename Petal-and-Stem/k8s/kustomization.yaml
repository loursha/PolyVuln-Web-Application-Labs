apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: petalstem-lab
resources:
  - namespace.yaml
  - secret.yaml
  - mysql.yaml
  - app.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: petalstem-db-init
    files:
      - 01-init.sql=init.sql
generatorOptions:
  disableNameSuffixHash: true
