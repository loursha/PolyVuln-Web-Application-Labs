apiVersion: apps/v1
kind: Deployment
metadata:
  name: petalstem-app
  namespace: petalstem-lab
spec:
  replicas: 1          # keep at 1: lab state (prototype pollution, rate limits) is per process
  selector: { matchLabels: { app: petalstem-app } }
  template:
    metadata: { labels: { app: petalstem-app } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: petalstem-app:1.0
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: petalstem-env } }]
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits: { cpu: "500m", memory: 384Mi }
---
# NodePort (not kubectl port-forward): port-forward connects from 127.0.0.1 inside the pod,
# which would expose the loopback-only SSRF target directly and spoil that exercise.
apiVersion: v1
kind: Service
metadata:
  name: petalstem-app
  namespace: petalstem-lab
spec:
  type: NodePort
  selector: { app: petalstem-app }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30080 }]
