<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduCore · Student Management Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
{% if me %}
<nav class="navbar navbar-expand-lg app-nav sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" width="30" height="30" alt="logo">
      <span>EduCore</span>
    </a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('students') }}">Students</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('student_add') }}">Enroll</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('search') }}">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('upload') }}">Files</a></li>
        {% if me['role'] == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin') }}">Admin</a></li>
        {% endif %}
      </ul>
      <div class="dropdown">
        <a class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          {{ me['full_name'] }} <span class="badge role-badge ms-1">{{ me['role'] }}</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="{{ url_for('profile') }}">My Profile</a></li>
          <li><a class="dropdown-item" href="{{ url_for('logout') }}">Log out</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
{% endif %}

<main class="{% if me %}app-main{% else %}auth-main{% endif %}">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
