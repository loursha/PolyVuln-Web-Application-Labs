{% extends "base.html" %}
{% block content %}
<h3 class="page-title">Search</h3>
<div class="card"><div class="card-body">
  <form method="get" class="mb-3">
    <div class="input-group" style="max-width:480px">
      <input name="term" class="form-control" placeholder="Search the portal...">
      <button class="btn btn-brand">Search</button>
    </div>
  </form>
  {% if term %}
  <p>Showing results for: <strong>{{ term|safe }}</strong></p>
  <p class="hint">No matching records found.</p>
  {% endif %}
</div></div>
{% endblock %}
