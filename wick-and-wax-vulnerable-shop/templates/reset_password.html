{% extends "base.html" %}
{% block title %}Set New Password -- Wick & Wax Co.{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="text-center mb-2">Set a New Password</h2>
  <form method="post" action="{{ url_for('reset_password', username=username, token=token) }}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username_display" value="{{ username }}" disabled>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="password" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update Password</button>
  </form>
</div>
{% endblock %}
