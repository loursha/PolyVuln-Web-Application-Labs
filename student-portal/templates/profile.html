{% extends "base.html" %}
{% block content %}
<h3 class="page-title">My Profile</h3>
<div class="card"><div class="card-body">
  <form method="post" style="max-width:600px">
    <div class="mb-3"><label class="form-label">Username</label>
      <input class="form-control" value="{{ me['username'] }}" disabled></div>
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="full_name" class="form-control" value="{{ me['full_name']|safe }}"></div>
    <div class="mb-3"><label class="form-label">Role</label>
      <input class="form-control" value="{{ me['role'] }}" disabled></div>
    <button class="btn btn-brand">Update</button>
  </form>
</div></div>
{% endblock %}
