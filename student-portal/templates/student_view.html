{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('students') }}" class="hint text-decoration-none">&larr; Back to students</a>
<div class="card mt-2"><div class="card-body">
  <div class="d-flex align-items-center gap-3 mb-3">
    <div class="avatar" style="width:60px;height:60px;font-size:1.5rem">{{ s['name'][0] }}</div>
    <div><h4 class="mb-0">{{ s['name'] }}</h4>
      <span class="badge bg-secondary">Grade {{ s['grade'] }}</span></div>
  </div>
  <h6 class="hint">Bio</h6>
  <div class="p-3 bg-light rounded">{{ s['bio']|safe }}</div>
</div></div>
{% endblock %}
